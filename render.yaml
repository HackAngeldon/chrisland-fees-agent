# Render Blueprint: one web service for the tool server Chord calls.
# Render generates both tokens; set PAYSTACK_SECRET_KEY (a TEST key) and, optionally,
# TEST_INBOX in the dashboard when it asks. PUBLIC_BASE_URL is this service's address.
services:
  - type: web
    name: chrisland-fees-agent
    runtime: node
    plan: free # sleeps after 15 idle minutes; see README for the cold-start note
    region: frankfurt # the closest Render region to Lagos
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PARENTS_TOKEN
        generateValue: true
      - key: BURSAR_TOKEN
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TEST_INBOX
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://chrisland-fees-agent.onrender.com
      - key: CAPTURE_REQUESTS
        value: "1"
      - key: PARENT_PAYS_PAYSTACK_FEE # the demo's Paystack account passes its fee to customers
        value: "1"
